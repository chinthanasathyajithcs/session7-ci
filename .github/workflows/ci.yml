name: Node.js CI

on: push

jobs:
  build-and-test:
    runs-on: ubuntu-latest              # 1. Create the runner
    steps:
      - uses: actions/checkout@v7       # 2. Clone the code
      - uses: actions/setup-node@v7     # 3. Install Node.js
        with:
          node-version: 26.x
      - run: npm ci                     # 4. Install dependencies
      - run: npm run build              # 5. Build
      - run: npm test                   # 6. Run the tests
